<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | Little Archive</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Main CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <a href="index.html">

                <img
                    src="logo.png"
                    alt="Little Archive"
                >

            </a>

        </div>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="orders.html">
                My Orders
            </a>

        </nav>


        <div class="header-icons">

            <a
                href="orders.html"
                class="header-icon"
                aria-label="My Orders"
            >

                <i class="fa-solid fa-box"></i>

            </a>


            <a
                href="profile.html"
                class="profile-btn"
                aria-label="Profile"
            >

                👤

            </a>

        </div>

    </header>



    <!-- ================= PROFILE ================= -->

    <main class="profile-page">


        <section class="profile-card">


            <div class="profile-avatar">

                <i class="fa-solid fa-user"></i>

            </div>


            <p class="profile-small-title">
                LITTLE ARCHIVE
            </p>


            <h1>
                My Profile
            </h1>


            <div class="profile-info">

                <div class="profile-info-row">

                    <i class="fa-solid fa-user"></i>

                    <div>

                        <span>
                            Name
                        </span>

                        <strong id="profile-name">
                            Loading...
                        </strong>

                    </div>

                </div>


                <div class="profile-info-row">

                    <i class="fa-solid fa-envelope"></i>

                    <div>

                        <span>
                            Email
                        </span>

                        <strong id="profile-email">
                            Loading...
                        </strong>

                    </div>

                </div>

            </div>


            <!-- My Orders -->

            <a
                href="orders.html"
                class="profile-orders-btn"
            >

                <i class="fa-solid fa-box"></i>

                My Orders

            </a>


            <!-- Logout -->

            <button
                type="button"
                class="logout-btn"
                id="logout-btn"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">

            <img
                src="logo.png"
                alt="Little Archive"
            >

        </div>


        <div class="footer-contact">

            <h2>
                Contacts
            </h2>

        </div>

    </footer>



    <!-- ================= PROFILE JAVASCRIPT ================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function() {


                /*
                 * Get logged-in user
                 */

                const user =
                    JSON.parse(
                        localStorage.getItem(
                            "littleArchiveUser"
                        )
                    );


                /*
                 * If nobody is logged in,
                 * send them to login page.
                 */

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                /*
                 * Display user information
                 */

                document.getElementById(
                    "profile-name"
                ).textContent =
                    user.name || "User";


                document.getElementById(
                    "profile-email"
                ).textContent =
                    user.email || "No email";


                /*
                 * Logout
                 */

                document.getElementById(
                    "logout-btn"
                ).addEventListener(
                    "click",
                    function() {


                        /*
                         * Remove logged-in user
                         */

                        localStorage.removeItem(
                            "littleArchiveUser"
                        );


                        /*
                         * Go to login page
                         */

                        window.location.href =
                            "login.html";

                    }
                );

            }
        );

    </script>


</body>

</html>
