<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Little Archive</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <img
                src="logo.png"
                alt="Little Archive Logo"
                class="auth-logo"
            >

            <div class="auth-brand">
                LITTLE ARCHIVE
            </div>

            <p class="auth-subtitle">
                ✦ cute stationery & little things ✦
            </p>

            <h1 class="auth-title">
                Welcome Back! ♡
            </h1>

            <p class="auth-description">
                Login to continue shopping with us.
            </p>


            <form id="login-form" class="auth-form">

                <div class="form-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    LOG IN ♡
                </button>

            </form>


            <p
                id="login-message"
                class="auth-message"
            ></p>


            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Little Archive
            </a>

        </section>

    </main>


    <!-- Your login JavaScript -->
    <script src="login.js"></script>

</body>

</html>
