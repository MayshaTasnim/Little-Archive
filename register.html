<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Little Archive</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <img
                src="logo.png"
                alt="Little Archive Logo"
                class="auth-logo"
            >

            <div class="auth-brand">
                LITTLE ARCHIVE
            </div>

            <p class="auth-subtitle">
                ✦ cute stationery & little things ✦
            </p>

            <h1 class="auth-title">
                Join Little Archive! ♡
            </h1>

            <p class="auth-description">
                Create an account and start exploring.
            </p>


            <form id="register-form" class="auth-form">

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    CREATE ACCOUNT ♡
                </button>

            </form>


            <p
                id="register-message"
                class="auth-message"
            ></p>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Little Archive
            </a>

        </section>

    </main>


    <script src="register.js"></script>

</body>

</html>
