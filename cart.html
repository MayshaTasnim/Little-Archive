    <!-- ================= CART PAGE ================= -->

        <section class="cart-heading">

            </p>

            <h1>

            </h1>

            <div class="cart-decoration">
                ───── ♡ ─────
            </div>

        </section>



        <!-- Cart Content -->

        <section
            class="cart-content"
            id="cart-content"
        >

            <!-- JavaScript will load cart items here -->

        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    </footer>



    <!-- ================= CART JAVASCRIPT ================= -->

    <script>

        // Load cart from LocalStorage

        let cart = JSON.parse(
            localStorage.getItem("littleArchiveCart")
        ) || [];


        const cartContent =
            document.getElementById("cart-content");


        const cartCount =
            document.getElementById("cart-count");



        // ================= CART COUNT =================

        function updateCartCount() {

            const totalQuantity =
                cart.reduce(
                    (total, item) =>
                        total + item.quantity,
                    0
                );

            cartCount.textContent =
                totalQuantity;

        }



        // ================= DISPLAY CART =================

        function displayCart() {

            updateCartCount();


            // Empty cart

            if (cart.length === 0) {

                cartContent.innerHTML = `

                    <div class="empty-cart">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <h2>
                            Your cart is empty
                        </h2>

                        <p>
                            Looks like you haven't
                            added anything yet.
                        </p>

                        <a
                            href="index.html"
                            class="continue-shopping-btn"
                        >
                            Continue Shopping
                        </a>

                    </div>

                `;

                return;

            }



            // Cart items

            let itemsHTML = "";


            cart.forEach(item => {

                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);


                itemsHTML += `

                    <article
                        class="cart-item"
                        data-product-id="${item.id}"
                    >

                        <div class="cart-item-image">

                            <img
                                src="${item.image}"
                                alt="${item.name}"
                            >

                        </div>


                        <div class="cart-item-info">

                            <h2>
                                ${item.name}
                            </h2>

                            <p class="cart-item-price">
                                ৳${item.price}
                            </p>


                            <div class="cart-item-actions">

                                <button
                                    class="quantity-btn decrease-btn"
                                    data-product-id="${item.id}"
                                    type="button"
                                >
                                    −
                                </button>


                                <span class="cart-quantity">
                                    ${item.quantity}
                                </span>


                                <button
                                    class="quantity-btn increase-btn"
                                    data-product-id="${item.id}"
                                    type="button"
                                >
                                    +
                                </button>


                                <button
                                    class="remove-cart-btn"
                                    data-product-id="${item.id}"
                                    type="button"
                                >
                                    Remove
                                </button>

                            </div>

                        </div>


                        <div class="cart-item-total">

                            ৳${itemTotal}

                        </div>

                    </article>

                `;

            });



            // Calculate subtotal

            const subtotal =
                cart.reduce(
                    (total, item) =>
                        total +
                        (
                            Number(item.price) *
                            Number(item.quantity)
                        ),
                    0
                );



            cartContent.innerHTML = `

                <div class="cart-items">

                    ${itemsHTML}

                </div>


                <div class="cart-summary">

                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ৳${subtotal}
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong>
                            ৳60
                        </strong>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <strong>
                            ৳${subtotal + 60}
                        </strong>

                    </div>


                   <a
    href="checkout.html"
    class="checkout-btn"
>
    Proceed to Checkout
</a>

                </div>

            `;

        }



        // ================= CART CLICKS =================

        cartContent.addEventListener(
            "click",
            function(event) {


                // Increase

                const increaseButton =
                    event.target.closest(
                        ".increase-btn"
                    );


                if (increaseButton) {

                    const id =
                        String(
                            increaseButton.dataset.productId
                        );


                    const item =
                        cart.find(
                            product =>
                                String(product.id) === id
                        );


                    if (item) {

                        item.quantity += 1;

                    }


                    localStorage.setItem(
                        "littleArchiveCart",
                        JSON.stringify(cart)
                    );


                    displayCart();

                    return;

                }



                // Decrease

                const decreaseButton =
                    event.target.closest(
                        ".decrease-btn"
                    );


                if (decreaseButton) {

                    const id =
                        String(
                            decreaseButton.dataset.productId
                        );


                    const item =
                        cart.find(
                            product =>
                                String(product.id) === id
                        );


                    if (item) {

                        if (item.quantity > 1) {

                            item.quantity -= 1;

                        } else {

                            cart =
                                cart.filter(
                                    product =>
                                        String(product.id) !== id
                                );

                        }

                    }


                    localStorage.setItem(
                        "littleArchiveCart",
                        JSON.stringify(cart)
                    );


                    displayCart();

                    return;

                }



                // Remove

                const removeButton =
                    event.target.closest(
                        ".remove-cart-btn"
                    );


                if (removeButton) {

                    const id =
                        String(
                            removeButton.dataset.productId
                        );


                    cart =
                        cart.filter(
                            product =>
                                String(product.id) !== id
                        );


                    localStorage.setItem(
                        "littleArchiveCart",
                        JSON.stringify(cart)
                    );


                    displayCart();

                }

            }
        );



        // Display when page opens

        displayCart();

    </script>


</body>
