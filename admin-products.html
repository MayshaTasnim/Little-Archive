<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Admin | Little Archive</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================= ADMIN HEADER ================= -->

    <header class="admin-header">

        <div class="admin-brand">

            <img
                src="logo.png"
                alt="Little Archive"
            >

            <span>
                Product Management
            </span>

        </div>


        <div class="admin-header-actions">

            <a
                href="admin-panel.html"
                class="admin-back-btn"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </a>


            <button
                type="button"
                class="admin-logout-btn"
                id="admin-logout-btn"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </header>



    <!-- ================= ADMIN PRODUCTS ================= -->

    <main class="admin-products-page">


        <!-- Page Heading -->

        <section class="admin-products-heading">

            <div>

                <p>
                    LITTLE ARCHIVE
                </p>

                <h1>
                    Products
                </h1>

                <span>
                    Manage your store products.
                </span>

            </div>


            <!-- Add Product -->

            <button
                type="button"
                class="admin-add-product-btn"
                id="add-product-btn"
            >

                <i class="fa-solid fa-plus"></i>

                Add Product

            </button>

        </section>



        <!-- ================= MESSAGE ================= -->

        <p
            id="admin-products-message"
            class="admin-products-message"
        ></p>



        <!-- ================= PRODUCTS ================= -->

        <section
            id="admin-products-list"
            class="admin-products-list"
        >

            <p class="admin-products-loading">
                Loading products...
            </p>

        </section>


    </main>



    <!-- ================= ADD PRODUCT MODAL ================= -->

    <div
        class="admin-modal"
        id="product-modal"
    >

        <div class="admin-modal-content">


            <div class="admin-modal-header">

                <h2 id="product-modal-title">
                    Add Product
                </h2>


                <button
                    type="button"
                    class="admin-modal-close"
                    id="product-modal-close"
                    aria-label="Close"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>



            <!-- Product Form -->

            <form id="product-form">


                <input
                    type="hidden"
                    id="product-id"
                >


                <!-- Name -->

                <div class="admin-form-group">

                    <label for="product-name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        required
                    >

                </div>



                <!-- Price -->

                <div class="admin-form-group">

                    <label for="product-price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>



                <!-- Category -->

                <div class="admin-form-group">

                    <label for="product-category">
                        Category
                    </label>

                    <select
                        id="product-category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="notebooks">
                            Notebooks
                        </option>

                        <option value="stickers">
                            Stickers
                        </option>

                        <option value="sticky-notes">
                            Sticky Notes
                        </option>

                        <option value="washi-tape">
                            Washi Tape
                        </option>

                    </select>

                </div>



                <!-- Unit -->

                <div class="admin-form-group">

                    <label for="product-unit">
                        Unit
                    </label>

                    <input
                        type="text"
                        id="product-unit"
                        placeholder="Example: piece or set"
                    >

                </div>



                <!-- Image -->

                <div class="admin-form-group">

                    <label for="product-image">
                        Image Path
                    </label>

                    <input
                        type="text"
                        id="product-image"
                        placeholder="Example: images/product.jpg"
                        required
                    >

                </div>



                <!-- Form Buttons -->

                <div class="admin-modal-actions">

                    <button
                        type="button"
                        class="admin-cancel-btn"
                        id="product-cancel-btn"
                    >

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="admin-save-product-btn"
                    >

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Product

                    </button>

                </div>


            </form>


        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="admin-products.js"></script>


</body>

</html>
