    <!-- ================= BACKEND CONNECTION ================= -->

    <script>

        async function loadNotebooks() {

            const productGrid =
                document.getElementById("product-grid");


            try {

                const response = await fetch(
                    "http://localhost:3000/api/products?category=notebooks"
                );


                if (!response.ok) {

                    throw new Error("Failed to load products");

                }


                const notebooks =
                    await response.json();


                productGrid.innerHTML = "";


                notebooks.forEach(product => {


                    const productCard =
                        document.createElement("article");


                    productCard.className =
                        "product-card";


                    productCard.innerHTML = `

                        <a
                            href="#"
                            class="product-image-link"
                        >

                            <div class="product-image">

                                <img
                                    src="${product.image}"
                                    alt="${product.name} Notebook"
                                >

                            </div>

                        </a>


                        <div class="product-info">

                            <h2>
                                ${product.name} Notebook
                            </h2>


                            <p class="product-price">
                                ৳${product.price}
                            </p>


                            <!-- FAVOURITE BUTTON -->

                        <button 
                        class="favourite-btn" 
                        type="button" 
                        data-product-id="${product.id}" 
                        aria-label="Add ${product.name} to favourites"
                        > 

                        <i class="fa-regular fa-heart"></i>

                        </button>


                        <!-- ADD TO CART BUTTON -->

                        <button
                        class="add-to-cart-btn"
                        type="button"
                        data-product-id="${product.id}"
                        aria-label="Add ${product.name} to cart"
                        >
                        <i class="fa-solid fa-cart-shopping"></i>
                        </button>
                        </div>

                    `;


                    productGrid.appendChild(productCard);

                });


                // Tell favourites system to update
                // after backend products are loaded

                if (typeof updateFavouriteButtons === "function") {

                    updateFavouriteButtons();

                }


            } catch (error) {

                console.error(
                    "Notebook loading error:",
                    error
                );


                productGrid.innerHTML = `

                    <p class="loading-message">

                        Unable to load notebooks.
                        Please make sure the backend is running.

                    </p>

                `;

            }

        }


        // Load notebooks when page opens

        loadNotebooks();

    </script>
